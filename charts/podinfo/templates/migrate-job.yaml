apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "podinfo.fullname" . }}-migrate
  labels:
    {{- include "podinfo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ include "podinfo.fullname" . }}-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Running pre-install/upgrade migration..."
              echo "Release: {{ .Release.Name }}"
              echo "Revision: {{ .Release.Revision }}"
              sleep 5
              echo "Migration done!"
