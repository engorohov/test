replicaCount: 2

image:
  tag: "latest"
  pullPolicy: Always

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi

podinfo:
  level: debug
  message: "PROD v1 - live!"
  ui:
    color: "#3498db"     # Синий цвет для прода

ingress:
  enabled: true
  host: podinfo-prod.local

postgresql:
  enabled: false        # Выключаем базу на проде по фиче condition!

